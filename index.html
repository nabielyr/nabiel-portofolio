    <meta name="theme-color" content="#F4EFE6" />

    <!-- Restore the saved theme before first paint so there's no flash -->
    <script>
      try {
        var saved = localStorage.getItem('theme')
        if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved
        if (saved === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F1B33')
      } catch (e) {}
    </script>
